{% extends "base.html" %}
{% block title %}Заявка — {{ SITE_NAME }}{% endblock %}
{% block content %}
<h1 class="h3">Заявка: {{ title }}</h1>
{% if block_reason %}
<div class="alert">{{ block_reason }}</div>
{% else %}
<form method="post" enctype="multipart/form-data" style="max-width:36rem">{% csrf_token %}
{% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}</div>{% endfor %}
<button class="btn btn-gold" type="submit">Отправить</button>
</form>
{% endif %}
{% endblock %}
