{% extends "base.html" %}
{% block title %}Вход — {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="card" style="max-width:28rem"><div class="card-body">
<h1 class="h4">Вход</h1>
<form method="post">{% csrf_token %}
{% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}</div>{% endfor %}
<button class="btn btn-gold" type="submit">Войти</button>
</form>
<p class="mt-3 mb-0"><a href="{% url 'accounts:register' %}">Регистрация</a></p>
</div></div>
{% endblock %}
