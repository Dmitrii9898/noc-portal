{% extends "base.html" %}
{% block title %}Регистрация — {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="card" style="max-width:36rem"><div class="card-body">
<h1 class="h4">Регистрация участника</h1>
<form method="post">{% csrf_token %}
{% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}</div>{% endfor %}
<button class="btn btn-gold" type="submit">Создать учётную запись</button>
</form></div></div>
{% endblock %}
