{% extends "base.html" %}
{% block title %}Профиль — {{ SITE_NAME }}{% endblock %}
{% block content %}
<h1 class="h3">Профиль</h1>
<form method="post" style="max-width:32rem">{% csrf_token %}
{% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}</div>{% endfor %}
<button class="btn btn-gold" type="submit">Сохранить</button>
</form>
{% endblock %}
