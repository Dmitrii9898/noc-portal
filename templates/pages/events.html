{% extends "base.html" %}
{% block title %}Мероприятия — {{ SITE_NAME }}{% endblock %}
{% block content %}
<h1 class="h3">Мероприятия</h1>
<ul class="list-group">{% for item in items %}
<li class="list-group-item"><a href="{{ item.get_absolute_url }}">{{ item.title }}</a>
<div class="small text-secondary">{{ item.starts_at|date:"d.m.Y H:i" }} · {{ item.place }} · мест: {{ item.seats }}</div></li>
{% endfor %}</ul>
{% endblock %}
