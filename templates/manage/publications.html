{% extends "base.html" %}
{% block title %}Публикации — {{ SITE_NAME }}{% endblock %}
{% block content %}
<h1 class="h3">Публикации</h1>
<ul class="list-group">{% for item in items %}<li class="list-group-item d-flex justify-content-between">
<span>{{ item.title }} — {% if item.is_published %}на портале{% else %}скрыта{% endif %}</span>
<form method="post">{% csrf_token %}<input type="hidden" name="publication_id" value="{{ item.pk }}"><button class="btn btn-sm btn-outline-secondary">Переключить</button></form>
</li>{% endfor %}</ul>
{% endblock %}
